<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tanks &amp; delivery history (desktop) — reference mockup</title>
<!--
  Static reference mockup, not shipped code. Mirrors the second view of
  src/screens/TruckIntakeScreen.tsx after the redesign: every figure is real store
  data (no invented "Bay 01 Open" telemetry), single-layer depot-cards, badge-*
  utilities for status, brand-green accents.
-->
<link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <figure>
    <figcaption>4 · Tanks &amp; delivery history — desktop (1280px)</figcaption>

    <div class="hdr">
      <div>
        <p class="eyebrow" style="margin:0"><span class="dot"></span>Inbound logistics &amp; stock delivery</p>
        <h1>Truck delivery intake</h1>
        <p class="lede">Log incoming bulk oil deliveries and verify against the supplier waybill.</p>
      </div>
      <div class="seg">
        <button type="button" aria-pressed="false">🚚 Log a delivery</button>
        <button type="button" aria-pressed="true">🏬 Tanks &amp; delivery history <span class="count">2</span></button>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi">
        <div>
          <div class="cap">💧 Total oil in stock</div>
          <div class="val">38,250 <span style="font:600 12px/1 ui-sans-serif,system-ui;color:var(--ink-muted)">litres</span></div>
          <div class="sub"><span class="bar"><i style="width:64%"></i></span>64% of capacity</div>
        </div>
        <div class="tile">🏬</div>
      </div>
      <div class="kpi">
        <div>
          <div class="cap">🚚 Deliveries logged today</div>
          <div class="val">2 <span style="font:600 12px/1 ui-sans-serif,system-ui;color:var(--ink-muted)">trucks</span></div>
          <div class="sub"><span class="dot" style="width:8px;height:8px"></span>Intake recorded</div>
        </div>
        <div class="tile">🚚</div>
      </div>
      <div class="kpi">
        <div>
          <div class="cap">⚖️ Shortfall today</div>
          <div class="val">0 <span style="font:600 12px/1 ui-sans-serif,system-ui;color:var(--ink-muted)">litres</span></div>
          <div class="sub" style="color:#059669">✓ Within ±50 L tolerance</div>
        </div>
        <div class="tile">🛡</div>
      </div>
      <div class="kpi">
        <div>
          <div class="cap">⛽ Empty kegs at depot</div>
          <div class="val">120 <span style="font:600 12px/1 ui-sans-serif,system-ui;color:var(--ink-muted)">25L kegs</span></div>
          <div class="sub">Available to decant bulk deliveries</div>
        </div>
        <div class="tile">⛽</div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px">
      <div>
        <h2>Storage tanks</h2>
        <p class="lede">Live volume in each tank, how full it is, and which supplier the last batch came from.</p>
      </div>
      <span class="badge badge-sky">2 tanks</span>
    </div>

    <div class="tanks">
      <div class="tank">
        <div class="top">
          <div>
            <div class="name">💧 Main Tank 1</div>
            <div class="vol">24,500 <span style="font:700 14px/1 ui-monospace,monospace;color:var(--ink-muted)">L</span></div>
            <div class="lede">Capacity: 60,000 litres</div>
          </div>
          <span class="badge badge-sky">41% full</span>
        </div>
        <div class="lev"><i style="width:41%"></i></div>
        <div class="prov">
          <div><span style="color:var(--ink-muted)">Primary supplier:</span><strong>Iyanuoluwa Refinery, Warri</strong></div>
          <div><span style="color:var(--ink-muted)">Last batch:</span><span class="mono">10,750 L</span></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px">
          <span style="color:#059669;font-weight:600">● Ready for dispensing</span>
          <button class="reset" type="button">Audit history →</button>
        </div>
      </div>
      <div class="tank">
        <div class="top">
          <div>
            <div class="name">💧 Main Tank 2</div>
            <div class="vol">13,750 <span style="font:700 14px/1 ui-monospace,monospace;color:var(--ink-muted)">L</span></div>
            <div class="lede">Capacity: 60,000 litres</div>
          </div>
          <span class="badge badge-sky">23% full</span>
        </div>
        <div class="lev"><i style="width:23%"></i></div>
        <div class="prov">
          <div><span style="color:var(--ink-muted)">Primary supplier:</span><strong>Delta Oil Mills</strong></div>
          <div><span style="color:var(--ink-muted)">Last batch:</span><span class="mono">13,750 L</span></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px">
          <span style="color:#059669;font-weight:600">● Ready for dispensing</span>
          <button class="reset" type="button">Audit history →</button>
        </div>
      </div>
    </div>

    <div class="log">
      <div class="card-head">
        <div style="display:flex;align-items:center;gap:8px">
          <span>🧾</span>
          <h2 style="font-size:16px">Delivery log</h2>
        </div>
        <span class="mono" style="font-size:12px;color:var(--ink-muted)">4 deliveries logged</span>
      </div>

      <div class="log-row">
        <div style="display:flex;align-items:center;gap:14px">
          <div class="mono" style="width:48px;height:48px;border-radius:12px;background:var(--muted);display:grid;place-items:center">
            <span style="font-weight:700">10T</span><span style="font-size:9px">veg</span>
          </div>
          <div>
            <strong>Iyanuoluwa Refinery, Warri</strong>
            <div class="mono" style="color:var(--ink-muted)">24/09/2026 08:12 · Golden Veg Oil</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
          <div style="text-align:right">
            <div class="mono" style="font-weight:700">+10,750 L</div>
            <div class="lede">10,750 L remaining</div>
          </div>
          <span class="badge badge-emerald">✓ 0 L match</span>
        </div>
      </div>

      <div class="log-row">
        <div style="display:flex;align-items:center;gap:14px">
          <div class="mono" style="width:48px;height:48px;border-radius:12px;background:var(--muted);display:grid;place-items:center">
            <span style="font-weight:700">KEG</span><span style="font-size:9px">red</span>
          </div>
          <div>
            <strong>Delta Oil Mills</strong>
            <div class="mono" style="color:var(--ink-muted)">23/09/2026 15:40 · Red Palm Oil</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
          <div style="text-align:right">
            <div class="mono" style="font-weight:700">+2,500 L</div>
            <div class="lede">2,500 L remaining</div>
          </div>
          <span class="badge badge-rose">⚠ -75 L flag</span>
        </div>
      </div>
    </div>
  </figure>
</body>
</html>
