<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Set a new password — reference mockup</title>
<!--
  Static reference mockup, not shipped code.
  Mirrors src/screens/ResetPasswordScreen.tsx. Shown only while the client is in
  password-recovery mode (the user arrived through a reset link), so it offers no
  cancel — the escape hatch is "Sign out instead".
-->
<style>
  :root { --canvas:#FAF6ED; --card:#fff; --line:#E6DECF; --ink:#0B0F19; --ink-muted:#645F56; --brand:#00B749; --brand-dark:#00A03F; --rose-bg:#FFE4E6; --rose-ink:#4C0519; --rose-line:#FDA4AF; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 20px; background:var(--canvas); color:var(--ink); font:400 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; display:flex; flex-wrap:wrap; gap:40px; justify-content:center; }
  .frame { width:380px; margin:0; }
  .frame > figcaption { font:700 11px/1.4 ui-monospace, monospace; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); margin:0 0 10px; }
  .brand { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:24px; }
  .mark { width:56px; height:56px; border-radius:16px; background:var(--brand); color:var(--ink); display:grid; place-items:center; font-size:26px; box-shadow:0 10px 15px -3px rgba(0,183,73,.2); }
  h1 { font:700 20px/1.2 "Plus Jakarta Sans", ui-sans-serif, system-ui; margin:0; }
  .sub { font-size:12px; color:var(--ink-muted); margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:0 1px 2px rgba(11,15,25,.05); }
  .card h2 { font:700 16px/1.3 "Plus Jakarta Sans", ui-sans-serif, system-ui; margin:0 0 14px; }
  .field { margin-bottom:14px; }
  label { display:block; margin-bottom:6px; font:700 12px/1.2 ui-sans-serif, system-ui; text-transform:uppercase; color:var(--ink-muted); }
  input { width:100%; min-height:44px; padding:10px 14px 10px 40px; font-size:14px; border:2px solid #CBD5E1; border-radius:12px; background:#fff; color:var(--ink); }
  input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 4px rgba(0,183,73,.15); }
  .wrap { position:relative; }
  .wrap .ico { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94A3B8; font-size:15px; }
  .btn { width:100%; border:0; border-radius:12px; padding:13px 16px; cursor:pointer; font:700 14px/1 ui-sans-serif, system-ui; color:var(--ink); background:var(--brand); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn.secondary { background:#F1F5F9; color:#334155; font-size:12px; margin-top:10px; padding:11px 16px; }
  .error { border-radius:12px; padding:12px; font-size:12px; margin:0 0 14px; display:flex; gap:8px; align-items:flex-start; background:var(--rose-bg); border:1px solid var(--rose-line); color:var(--rose-ink); }
  .foot { text-align:center; font-size:11px; color:var(--ink-muted); margin:16px 0 0; }
</style>
</head>
<body>
  <figure class="frame">
    <figcaption>2a · Set a new password</figcaption>
    <div class="brand">
      <div class="mark">◐</div>
      <h1>Iyanuoluwa Depot</h1>
      <p class="sub">Password recovery</p>
    </div>
    <div class="card">
      <h2>Set a new password</h2>
      <div class="field">
        <label for="p1">New password</label>
        <div class="wrap"><span class="ico">🔒</span><input id="p1" type="password" placeholder="At least 6 characters" /></div>
      </div>
      <div class="field">
        <label for="p2">Confirm new password</label>
        <div class="wrap"><span class="ico">🔒</span><input id="p2" type="password" placeholder="Repeat the password" /></div>
      </div>
      <button class="btn" type="button">Save new password →</button>
      <button class="btn secondary" type="button">Sign out instead</button>
    </div>
    <p class="foot">Reset links expire after a short while. If this one has stopped working, request a new one from the sign-in screen.</p>
  </figure>

  <figure class="frame">
    <figcaption>2b · Mismatched confirmation</figcaption>
    <div class="brand">
      <div class="mark">◐</div>
      <h1>Iyanuoluwa Depot</h1>
      <p class="sub">Password recovery</p>
    </div>
    <div class="card">
      <h2>Set a new password</h2>
      <div class="field">
        <label for="q1">New password</label>
        <div class="wrap"><span class="ico">🔒</span><input id="q1" type="password" value="newdepotpass" /></div>
      </div>
      <div class="field">
        <label for="q2">Confirm new password</label>
        <div class="wrap"><span class="ico">🔒</span><input id="q2" type="password" value="newdepotpas" /></div>
      </div>
      <div class="error">⚠ Both passwords must match.</div>
      <button class="btn" type="button">Save new password →</button>
      <button class="btn secondary" type="button">Sign out instead</button>
    </div>
    <p class="foot">Reset links expire after a short while. If this one has stopped working, request a new one from the sign-in screen.</p>
  </figure>
</body>
</html>
