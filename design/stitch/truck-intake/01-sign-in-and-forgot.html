<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in / Forgot password — reference mockup</title>
<!--
  Static reference mockup, not shipped code.
  Mirrors src/screens/LoginScreen.tsx + src/components/common/AuthShell.tsx using the
  real tokens from src/index.css and tailwind.config.js:
    canvas #FAF6ED · card #FFFFFF on #E6DECF · brand-500 #00B749
    muted #F3ECE0 · text #0B0F19 / #645F56
-->
<style>
  :root {
    --canvas:#FAF6ED; --card:#fff; --line:#E6DECF; --ink:#0B0F19; --ink-muted:#645F56;
    --brand:#00B749; --brand-dark:#00A03F;
    --rose-bg:#FFE4E6; --rose-ink:#4C0519; --rose-line:#FDA4AF;
    --green-bg:#D1FAE5; --green-ink:#064E3B; --green-line:#6EE7B7;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--canvas); color:var(--ink); padding:40px 20px;
    font:400 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    display:flex; flex-wrap:wrap; gap:40px; justify-content:center;
  }
  .frame { width:380px; margin:0; }
  .frame > figcaption {
    font:700 11px/1.4 ui-monospace, monospace; text-transform:uppercase;
    letter-spacing:.08em; color:var(--ink-muted); margin:0 0 10px;
  }
  .brand { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:24px; }
  .mark {
    width:56px; height:56px; border-radius:16px; background:var(--brand); color:var(--ink);
    display:grid; place-items:center; font-size:26px; box-shadow:0 10px 15px -3px rgba(0,183,73,.2);
  }
  h1 { font:700 20px/1.2 "Plus Jakarta Sans", ui-sans-serif, system-ui; margin:0; }
  .sub { font-size:12px; color:var(--ink-muted); margin:0; text-align:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:0 1px 2px rgba(11,15,25,.05); }
  .card h2 { font:700 16px/1.3 "Plus Jakarta Sans", ui-sans-serif, system-ui; margin:0 0 14px; }
  .field { margin-bottom:14px; }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  label {
    display:block; margin-bottom:6px; font:700 12px/1.2 ui-sans-serif, system-ui;
    text-transform:uppercase; letter-spacing:.02em; color:var(--ink-muted);
  }
  input {
    width:100%; min-height:44px; padding:10px 14px 10px 40px; font-size:14px;
    border:2px solid #CBD5E1; border-radius:12px; background:#fff; color:var(--ink);
  }
  input:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 4px rgba(0,183,73,.15); }
  .wrap { position:relative; }
  .wrap .ico { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94A3B8; font-size:15px; }
  .link { background:none; border:0; padding:0; cursor:pointer; font:700 12px/1.2 ui-sans-serif, system-ui; color:var(--brand-dark); text-decoration:underline; }
  .btn {
    width:100%; border:0; border-radius:12px; padding:13px 16px; cursor:pointer;
    font:700 14px/1 ui-sans-serif, system-ui; color:var(--ink); background:var(--brand);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:hover { background:#33C86A; }
  .btn.secondary { background:#F1F5F9; color:#334155; font-size:12px; margin-top:10px; padding:11px 16px; }
  .error, .success, .note { border-radius:12px; padding:12px; font-size:12px; margin:0 0 14px; display:flex; gap:8px; align-items:flex-start; }
  .error { background:var(--rose-bg); border:1px solid var(--rose-line); color:var(--rose-ink); }
  .success { background:var(--green-bg); border:1px solid var(--green-line); color:var(--green-ink); }
  .hint { font-size:11px; color:var(--ink-muted); margin:6px 0 0; }
  .foot { text-align:center; font-size:11px; color:var(--ink-muted); margin:16px 0 0; }
</style>
</head>
<body>
  <figure class="frame">
    <figcaption>1a · Sign in (default)</figcaption>
    <div class="brand">
      <div class="mark">◐</div>
      <h1>Iyanuoluwa Depot</h1>
      <p class="sub">Sign in to your depot operations account</p>
    </div>
    <div class="card">
      <h2>Sign in</h2>
      <div class="field">
        <label for="a1">Email or Username</label>
        <div class="wrap"><span class="ico">✉</span><input id="a1" type="text" placeholder="you@depot.com or username" /></div>
      </div>
      <div class="field">
        <div class="row">
          <label for="a2" style="margin-bottom:6px">Password</label>
          <button class="link" type="button">Forgot password?</button>
        </div>
        <div class="wrap"><span class="ico">🔒</span><input id="a2" type="password" value="password" /></div>
      </div>
      <button class="btn" type="button">Sign in →</button>
    </div>
    <p class="foot">Need an account? Accounts are created by the depot owner — ask them to add you in Team &amp; Access.</p>
  </figure>

  <figure class="frame">
    <figcaption>1b · Forgot password sent</figcaption>
    <div class="brand">
      <div class="mark">◐</div>
      <h1>Iyanuoluwa Depot</h1>
      <p class="sub">Password recovery</p>
    </div>
    <div class="card">
      <h2>Forgot password</h2>
      <div class="field">
        <label for="b1">Email address</label>
        <div class="wrap"><span class="ico">✉</span><input id="b1" type="email" value="you@depot.com" /></div>
        <p class="hint">We'll email a one-time link to set a new password. Staff accounts that sign in with a username have no inbox — the owner resets those from Team &amp; Access.</p>
      </div>
      <div class="success">✓ If you@depot.com has a depot account, a reset link is on its way. Open it on this device to choose a new password.</div>
      <button class="btn" type="button">Send reset link →</button>
      <button class="btn secondary" type="button">← Back to sign in</button>
    </div>
    <p class="foot">Still stuck? The owner can set a new password for you in Team &amp; Access.</p>
  </figure>

  <figure class="frame">
    <figcaption>1c · Bare username rejected (nothing to send to)</figcaption>
    <div class="brand">
      <div class="mark">◐</div>
      <h1>Iyanuoluwa Depot</h1>
      <p class="sub">Password recovery</p>
    </div>
    <div class="card">
      <h2>Forgot password</h2>
      <div class="field">
        <label for="c1">Email address</label>
        <div class="wrap"><span class="ico">✉</span><input id="c1" type="text" value="musa.abdullahi" /></div>
        <p class="hint">We'll email a one-time link to set a new password. Staff accounts that sign in with a username have no inbox — the owner resets those from Team &amp; Access.</p>
      </div>
      <div class="error">⚠ Password reset needs a real email address. Staff accounts created with a username can only be reset by the owner — ask them in Team &amp; Access.</div>
      <button class="btn" type="button">Send reset link →</button>
      <button class="btn secondary" type="button">← Back to sign in</button>
    </div>
    <p class="foot">Still stuck? The owner can set a new password for you in Team &amp; Access.</p>
  </figure>
</body>
</html>
